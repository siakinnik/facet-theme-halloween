name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check that code is English (translations only in the manifest)
        run: python3 scripts/check_i18n.py

      - name: Check version consistency (CMakeLists.txt vs manifest.json)
        run: bash scripts/version.sh

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++

      - name: Build (the theme file is written by the generator)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Check the theme file against the core's limits
        run: python3 scripts/ci/check-theme.py build/theme-halloween.plugin/halloween.json

      - name: Pack
        run: bash scripts/ci/package.sh build/theme-halloween.plugin "$(bash scripts/version.sh)" dist x86_64
